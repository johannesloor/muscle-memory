name: Release

# Tag-triggered release: run the full CI matrix (ci.yml) once more, publish to PyPI via trusted
# publishing (OIDC, no stored secret), then publish the MCP Registry entry, also via GitHub
# OIDC (no stored secret). No job in this workflow references a `secrets.*` value.
on:
  push:
    tags:
      - "v*"

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish-pypi:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for PyPI trusted publishing (OIDC)
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      # Fail fast rather than publish the wrong version: the pushed tag (minus the leading
      # 'v') must equal the version in server.json and the package's __version__.
      - name: Verify tag matches server.json and package version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          server_version="$(python3 -c 'import json; print(json.load(open("server.json"))["version"])')"
          if [ "$tag_version" != "$server_version" ]; then
            echo "tag v$tag_version does not match server.json version $server_version" >&2
            exit 1
          fi
          package_version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/muscle_memory_mcp/__init__.py)"
          if [ "$tag_version" != "$package_version" ]; then
            echo "tag v$tag_version does not match __version__ $package_version" >&2
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-mcp-registry:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # required for `mcp-publisher login github-oidc`
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
          chmod +x mcp-publisher
      - name: Authenticate to the MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish
